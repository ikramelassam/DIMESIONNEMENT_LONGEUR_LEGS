# =====================================================================
#  Gr2 - dimensionnement des pattes : FICHIER D'ENTREES
#  Unites : mm, kg, N.m, degres.  Repere corps : origine au centre du
#  chassis (vue de dessus), x vers l'avant, y vers la gauche, z vers le
#  haut ; les hauteurs "z_rel" sont mesurees depuis le DESSOUS du chassis.
#  [HYP] = valeur hypothetique a remplacer par la valeur reelle.
#  [CDC] = cahier des charges (fixe).  [EQ] = decision d'equipe.
# =====================================================================

chassis:
  N_ch: 200.0        # longueur exterieure (x) [EQ 11/10 : 20 cm]
  M_ch: 200.0        # largeur exterieure (y) [EQ 11/10 : 20 cm, carre suppose]
  c: 15.0            # retrait de l'axe (C1 ou C2) par rapport au bord [HYP]
  e: 15.0            # hauteur de l'axe C2 au-dessus du dessous du chassis [HYP]
  overhang_C2: 10.0  # (montage "dedans") debord max autorise de l'axe C2 hors du chassis [HYP]
  mount: dedans      # "dedans" ou "dehors" (L1 dans / hors du chassis) [EQ]

leg:
  L1: 30.0           # coxa = L1_min mesure en CAO [HYP]
  seg_lin_mass: 0.162   # kg/m : plat alu 20x3 mm (2700 kg/m3 x 60 mm2) [HYP]
  bracket_mass: 0.015   # kg par articulation (equerres, vis) [HYP]
  foot_mass: 0.010      # kg [HYP]
  foot_diam: 20.0       # mm [HYP]
  leg_width: 25.0       # largeur d'une patte vue de dessus (collisions) [HYP]

# --- Masses du corps (hors pattes). 4 kg max = robot SANS bras [CDC+EQ] ---
body:
  chassis:  {m: 1.50, x: 0.0,   y: 0.0, z_rel: 25.0}   # chassis + cables + electronique [HYP]
  battery:  {m: 0.54, x: -20.0, y: 0.0, z_rel: 15.0}   # position nominale [EQ masse, HYP position]
  battery_zone: {x: [-80.0, 40.0], y: [-30.0, 30.0], z_rel: [10.0, 25.0]}  # zone possible [HYP]
  object_mass: 0.10  # [CDC]
  # --- Bras : modele plan a 3 masses ponctuelles (vue de cote, plan x-z) [HYP] ---
  #   epaule = point de fixation sur le chassis ; coude ; bout (pince).
  #   coude = epaule + a1 (cos phi1, sin phi1) ; bout = coude + a2 (cos(phi1+phi2), sin(phi1+phi2))
  #   phi1 mesure depuis l'horizontale vers l'avant (+ vers le haut) ; l'objet est dans la pince.
  arm_model:
    mount_from_front: 15.0   # epaule a 15 mm en retrait du bord avant du chassis [HYP]
    mount_y: 0.0             # bras dans l'axe du robot [HYP]
    mount_z_rel: 40.0        # epaule a 40 mm au-dessus du dessous du chassis (dessus du chassis) [HYP]
    a1: 80.0                 # epaule -> coude (mm) [HYP]
    a2: 70.0                 # coude -> pince (mm) ; a1 + a2 = 150 = distance objet/fixation [CDC]
    m_base: 0.15             # tourelle + servo(s) d'epaule (kg) [HYP]
    m_elbow: 0.15            # servo de coude + segments (kg) [HYP]
    m_tip: 0.10              # pince + son servo (kg) [HYP] ; total 0,40 kg [EQ]
    postures:                # [phi1, phi2] en degres ; obj = l'objet est-il porte ?
      replie:    {phi: [100.0, 160.0], obj: false}   # replie au-dessus du chassis
      transport: {phi: [90.0, -90.0],  obj: true}    # bras leve, avant-bras horizontal, objet tenu
      tendu:     {phi: [0.0, 0.0],     obj: true}    # bras horizontal vers l'avant : bras de levier max
  walk_posture: transport   # posture du bras pendant la marche (scenario nominal)
  manip_posture: tendu      # posture du bras pendant la saisie (4 pieds au sol)
  walk_postures_S2: [replie, transport]   # pire cas en marche : regle d'usage = pas de marche bras tendu [EQ a valider]
  manip_postures_S2: [replie, transport, tendu]
  eps_cdg_xy: 10.0          # incertitude CdG sans CAO (mm) [HYP]
  eps_cdg_z: 10.0
  eps_s1: 0.0               # incertitude ajoutee en scenario nominal S1 (0 = nominal pur)
  mass_robot_max_sans_bras: 4.0   # [CDC+EQ]

# --- Catalogue FabLab EMINES 2026-27 (Catalogue_Motorisation_V1_26-27) ---
# C_stall = couple MAX / de blocage du catalogue (N.m ; 1 kg.cm = 0,0981 N.m).
# Couple utilise dans le calcul = frac_couple x C_stall / SF.
# stock = nombre d'unites disponibles (null = inconnu, suppose suffisant).
# Il faut 4 unites identiques par type d'articulation (4 pattes symetriques).
# Exclus d'office : HSR-2645CR (rotation continue, pas d'asservissement en position),
# moteurs pas-a-pas NEMA 17/23/34 (0,4-0,5 N.m pour 350-400 g), motoreducteurs DC
# (pas de boucle de position integree, masses non donnees), gros moteurs (> 1 kg).
# Verification du 17/11 (catalogue V1 26-27 + fiches constructeur / revendeurs) :
#   SG90   : catalogue 1,5 kg.cm, 14 g, 4,2-6 V. Fiche TowerPro : 1,8 kg.cm a 4,8 V, 9 g
#            (10,6 g avec cable). On garde 14 g (prudent) ; a 9 g : -20 g de pattes,
#            NESM 4,10 -> 4,05 mm, C2 1,273 -> 1,266 N.m (negligeable). A peser au labo.
#   S-U400 : catalogue 98,6 oz.in a 6,6 V (= 7,1 kg.cm), 1,38 oz ; web : 39 g. OK.
#   S3306  : catalogue 24 kg.cm a 6 V, 126 g ; servodatabase / revendeurs : 126 g
#            (la version metal S3306MG fait 130 g). 4,8-6,0 V : 19,2 kg.cm a 4,8 V. OK.
#   ATTENTION TENSIONS : S3306 et SG90 <= 6 V, mais le couple du S-U400 est donne a 6,6 V.
#   Une seule alimentation 6 V -> S-U400 ~ 6,5 kg.cm = 0,638 N.m (extrapole lineairement
#   entre 6,6 et 7,4 V). Avec deux rails (6 V pour S3306/SG90, 7,4 V = 2S pour S-U400)
#   on a 0,696 (6,6 V) a 0,775 N.m (7,4 V). Tester : run_final.py OPT_6V, ou
#   demo_un_design.py --set servos.S-U400.C_stall=0.638
servos:
  - {name: SG90,    C_stall: 0.147, mass: 0.014,  range: 180.0, stock: null}  # 1,5 kg.cm ; 14 g catalogue (9 g fiche)
  - {name: S-U400,  C_stall: 0.696, mass: 0.039,  range: 180.0, stock: null}  # 98,6 oz.in a 6,6 V ; 1,38 oz = 39 g
  - {name: S3306,   C_stall: 2.354, mass: 0.126,  range: 180.0, stock: null}  # 24 kg.cm a 6 V ; 126 g ; servo de l'equipe
  # Dynamixel : PAS au labo (stock 1 < 4 -> jamais retenus) ; gardes pour run_study.py seulement.
  - {name: AX-12A,  C_stall: 1.5,   mass: 0.0546, range: 300.0, stock: 1}     # 12 V ; masse : e-manual Robotis
  - {name: MX-28T,  C_stall: 2.5,   mass: 0.072,  range: 360.0, stock: 1}     # 12 V ; masse a verifier
  - {name: MX-64AT, C_stall: 6.0,   mass: 0.126,  range: 360.0, stock: 1}     # 12 V ; masse a verifier
  - {name: MX-106T, C_stall: 8.4,   mass: 0.153,  range: 360.0, stock: 1}     # 12 V ; masse a verifier
# Fraction du couple de blocage utilisable en continu. Robotis : mouvements
# stables si charge <= 1/5 du couple de blocage (e-manual AX-12A). Pas de regle
# publiee pour les servos Futaba -> parametre etudie en sensibilite.
frac_couple: 1.0             # 1.0 = on autorise jusqu'au blocage / SF (optimiste) [A FIXER]
reference_servo: S3306       # masses de reference pour le CdG des pattes

# --- Taches, allure, marges ---
task:
  obstacle: 30.0         # [CDC]
  dh_lift: 20.0          # marge de levee au-dessus de l'obstacle (Zamani 2018) [HYP]
  h_margin: 10.0         # garde au sol >= obstacle + h_margin (obstacle sous le ventre) [EQ]
  stroke: 40.0           # course R_s du pied par cycle (vitesse = plafond) [HYP]
  yaw_step: 10.0         # pas de rotation sur place (deg) [HYP]
  accel: 0.5             # acceleration de reference du corps (m/s2) [HYP]
  sway_max: 60.0         # balancement max du corps cherche (mm)
  sway_n: 11             # grille de balancement n x n

margins:
  SF: 1.2                # coefficient de securite sur le couple [EQ a fixer]
  nesm_min: 0.0          # plus de seuil sur le NESM : il est maximise (f2)
  s_min: 0.0             # contrainte de stabilite : SSM - z_G a/g - eps_pied >= s_min (mm)
  nesm_cible: 2.0        # NESM exige pour le choix 'epsilon-contrainte' (mm) [EQ a fixer]
  eps_foot: 5.0          # erreur de placement du pied (mm) [HYP]
  theta3_min: 20.0       # garde-fou singularite (deg)
  theta3_max: 160.0
  joint_margin: 5.0      # marge aux butees (deg)
  servo_spacing: 40.0    # distance min entre axes C1 voisins (encombrement servo) [HYP]
  feet_clearance: 30.0   # distance min entre pieds / pattes (mm)
  chassis_clearance: 10.0  # pied a au moins ... mm hors du contour du chassis
  reach_margin: 5.0      # marge de portee |L2-L3|+m <= d <= L2+L3-m (mm)

search:
  n_sobol: 8192          # echantillons (puissance de 2)
  seed: 1
  bounds:                # variables de decision
    L2:   [40.0, 140.0]
    L3:   [60.0, 200.0]
    alpha: [2.0, 70.0]     # alpha > 0 : architecture 2
    beta: [30.0, 130.0]    # elargi le 12/10 : borne 100 atteinte
    xi:   [0.0, 90.0]
  refine_rounds: 2
  refine_per_point: 24

robust:
  n_mc: 100
  rel_mass: 0.10         # +-10 % masses (Bjelonic 2023)
  rel_torque: 0.10       # -10 % couple servo
  abs_len: 2.0           # +-2 mm longueurs
  abs_ang: 2.0           # +-2 deg posture
  abs_cdg: 10.0          # +-10 mm CdG corps
  pass_rate: 0.95
  backoff_h: 10.0       # recul de la garde au sol (mm) pour la contrepartie robuste
  backoff_nesm: 0.5     # recul du NESM minimal (mm)
